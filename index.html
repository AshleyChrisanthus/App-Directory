<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Directory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <h1 class="logo">📂 App Directory</h1>
    </div>
    <div class="header-right">
      <button id="refreshAllBtn" class="btn btn-ghost" title="Check for updated icons">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span class="btn-label">Refresh Icons</span>
      </button>
      <button id="acceptAllIconsBtn" class="btn btn-success" style="display: none;" title="Accept all proposed icon updates">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span class="btn-label">Accept All (<span id="pendingIconsCount">0</span>)</span>
      </button>
      <button id="dismissAllIconsBtn" class="btn btn-ghost" style="display: none;" title="Dismiss all proposed icon updates">
        <span class="btn-label">Dismiss All</span>
      </button>
      <button id="importBtn" class="btn btn-ghost" title="Import from JSON">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="btn-label">Import</span>
      </button>
      <button id="exportBtn" class="btn btn-ghost" title="Export to JSON">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="btn-label">Export</span>
      </button>
      <button id="themeToggle" class="btn btn-icon" title="Toggle theme">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name or URL…" autocomplete="off">
      </div>
      <!-- Multi-Category Filter Dropdown with Checkboxes -->
      <div class="custom-dropdown" id="catFilterDropdown">
        <button type="button" class="custom-dropdown-btn" id="catFilterBtn" title="Filter by categories">
          <span id="catFilterLabel">All Categories</span>
          <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="custom-dropdown-menu" id="catFilterMenu">
          <div class="dropdown-header-actions">
            <span class="dropdown-header-title">Categories</span>
            <div class="dropdown-header-btns">
              <button type="button" class="dropdown-action-btn" id="selectAllCatsBtn">Select All</button>
              <button type="button" class="dropdown-action-btn" id="clearAllCatsBtn">Clear</button>
            </div>
          </div>
          <div class="dropdown-mode-row">
            <span class="dropdown-mode-label">Match:</span>
            <div class="dropdown-mode-toggle">
              <button type="button" class="mode-btn active" id="modeUnionBtn" data-mode="union" title="Show websites with ANY selected category (Union)">Any (Union)</button>
              <button type="button" class="mode-btn" id="modeIntersectBtn" data-mode="intersect" title="Show websites with ALL selected categories (Intersection)">All (Intersection)</button>
            </div>
          </div>
          <div class="dropdown-list" id="catFilterList">
            <!-- Populated dynamically with checkboxes by JS -->
          </div>
        </div>
      </div>
      <button id="manageCategoriesBtn" class="btn btn-icon" title="Manage categories">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <select id="sortSelect">
        <option value="dateAdded-desc">Newest First</option>
        <option value="dateAdded-asc">Oldest First</option>
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="visitCount-desc">Most Visited</option>
        <option value="lastVisited-desc">Recently Visited</option>
      </select>
    </div>
    <div class="toolbar-right">
      <button id="addBtn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Website
      </button>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="stats-bar">
    <span id="statsText">0 sites</span>
  </div>

  <!-- Card grid -->
  <main class="grid" id="grid">
    <!-- Cards rendered by JS -->
  </main>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">🌐</div>
    <h2>No websites yet</h2>
    <p>Click <strong>Add Website</strong> to save your first site to the directory.</p>
  </div>

  <!-- Modal backdrop -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Website</h2>
        <button class="btn btn-icon modal-close" id="modalClose" title="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="entryForm" novalidate>
        <div class="form-group">
          <label for="entryName">Name <span class="required">*</span></label>
          <input type="text" id="entryName" placeholder="e.g. GitHub" required>
        </div>
        <div class="form-group">
          <label for="entryUrl">URL <span class="required">*</span></label>
          <input type="url" id="entryUrl" placeholder="e.g. https://github.com" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Categories <span class="optional">(type or pick, press Enter to add)</span></label>
            <div class="tag-input-wrapper">
              <div class="tag-input-tags" id="categoryTags">
                <!-- Category chips rendered by JS -->
              </div>
              <div class="tag-input-row">
                <input type="text" id="entryCategory" list="categorySuggestions" placeholder="e.g. Development" autocomplete="off">
                <button type="button" class="btn btn-ghost btn-sm" id="addCategoryBtn" title="Add category">+</button>
              </div>
              <datalist id="categorySuggestions">
                <!-- Populated by JS -->
              </datalist>
            </div>
          </div>
          <div class="form-group">
            <label for="entryIcon">Icon <span class="optional">(auto-fetch, paste image/URL, or upload)</span></label>
            <div class="icon-input-group">
              <div class="icon-preview-box" id="entryIconPreview" title="Icon preview (click 📁 or paste image with Ctrl+V)">
                <span class="icon-fallback">🌐</span>
              </div>
              <input type="text" id="entryIcon" placeholder="Paste image (Ctrl+V), URL, or leave blank">
              <button type="button" class="btn btn-ghost btn-sm" id="uploadIconBtn" title="Upload image file from computer">📁</button>
              <input type="file" id="iconFileInput" accept="image/*" style="display:none;">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="entryDescription">Description</label>
          <textarea id="entryDescription" rows="3" placeholder="Optional short description…"></textarea>
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="entryFavorite">
            <span>⭐ Mark as favorite</span>
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Category management modal -->
  <div class="modal-backdrop" id="catModalBackdrop">
    <div class="modal" id="catModal">
      <div class="modal-header">
        <h2>Manage Categories</h2>
        <button class="btn btn-icon modal-close" id="catModalClose" title="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="cat-modal-body">
        <p class="cat-modal-hint">Rename or delete categories. Changes apply to all websites using that category.</p>
        <div id="catList" class="cat-list">
          <!-- Category rows rendered by JS -->
        </div>
        <div class="cat-modal-empty" id="catEmptyMsg" style="display:none;">No categories in use yet.</div>
      </div>
    </div>
  </div>

  <!-- Hidden file input for import -->
  <input type="file" id="importFile" accept=".json" style="display:none;">

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
